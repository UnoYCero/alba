<!doctype html>

  <title>Página no encontrada · Alba Vision</title>

  <!-- Esta página también la muestra app/not-found.js (Next): de aquí toma los estilos y el cuerpo.
       Rutas absolutas, porque se ve en cualquier dirección. Sin JavaScript. -->
  <style>
    .no-encontrada { position: relative; min-height: 100svh; display: grid; place-items: center; overflow: hidden; text-align: center; padding: var(--s9) var(--gutter); background: #03081a; }
    .no-encontrada .orbitas { position: absolute; left: 50%; top: 50%; width: min(1100px, 170vw); aspect-ratio: 1; translate: -50% -50%; pointer-events: none; }
    .no-encontrada .orbitas circle { fill: none; stroke: rgba(143,178,255,.12); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .no-encontrada > div { position: relative; }
    .no-encontrada img.logo { width: 168px; height: auto; margin: 0 auto var(--s8); }
    .no-encontrada h1 { font-size: clamp(40px,6vw,76px); line-height: 1.02; letter-spacing: -.035em; text-wrap: balance; }
    .no-encontrada h1 em { color: var(--soft); }
    .no-encontrada p { margin: var(--s5) auto 0; max-width: 38ch; color: var(--dim); text-wrap: pretty; }
    .no-encontrada nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--s3) var(--s6); margin-top: var(--s7); }
    .no-encontrada .en { margin-top: var(--s8); font-size: 15px; color: var(--faint); }
    .no-encontrada .en a { color: var(--paper); text-decoration: underline; text-decoration-color: rgba(143,178,255,.4); text-underline-offset: 5px; }
  </style>
</head>
<body>
  <main class="no-encontrada">
    <svg class="orbitas" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="18"/><circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="44"/></svg>
    <div>
      <a href="/" aria-label="Alba Vision, ir a la portada"><img class="logo" src="/assets/alba-vision-lockup-on-dark.webp" alt="Alba Vision" width="504" height="69"></a>
      <h1>Esta página quedó <em>fuera de cuadro.</em></h1>
